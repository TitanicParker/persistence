<script>
(() => {
  "use strict";

  const SQRT3 = Math.sqrt(3);
  const TAU = Math.PI * 2;
  const OFFSET_LABELS = ["A", "B", "C", "D", "E", "F"];
  const MODES = ["opposite_side_memory", "carrier_weave", "catchment_settlement", "cell_lattice_bloom"];

  const ledger = JSON.parse(document.getElementById("theorem-zero-ledger").textContent);
  const offsets = ledger.substrate_definition.step_definition.unit_neighbour_offsets;
  const families = ledger.substrate_definition.carrier_family_definition.native_families;
  const stageSpecs = ledger.activation_program.stages.map((stage) => {
    const centres = Object.entries(stage.active_centres).map(([key, pair]) => ({ key, q: pair[0], r: pair[1] }));
    const duration = ledger.rendering_program.stage_durations_ms[stage.key];
    const viewReach = ledger.rendering_program.view_reach[stage.key];
    return { key: stage.key, centres, duration, viewReach };
  });
  const totalDuration = stageSpecs.reduce((sum, stage) => sum + stage.duration, 0);

  if (ledger.canonical_status !== "canonical_substrate_v1_0") throw new Error("Canonical status mismatch");
  if (ledger.field_type !== "triangular_barycentric") throw new Error("Field type mismatch");
  if (families.join("|") !== "q = constant|r = constant|q + r = constant") throw new Error("Carrier family mismatch");

  const canvas = document.getElementById("theorem-zero-canvas");
  const ctx = canvas.getContext("2d", { alpha: true });
  let dpr = 1, width = 2, height = 2, centre = { x: 1, y: 1 }, unit = 1;

  function resize() {
    const box = canvas.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    width = Math.max(2, Math.floor(box.width * dpr));
    height = Math.max(2, Math.floor(box.height * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    centre = { x: width / 2, y: height / 2 };
  }

  function keyOf(q, r) { return q + "," + r; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
  function pulse(a, b, x) { return smooth((x - a) / (b - a)); }
  function fadeOut(a, b, x) { return 1 - pulse(a, b, x); }
  function windowInOut(a, b, x) { return pulse(a, (a + b) * 0.5, x) * fadeOut((a + b) * 0.5, b, x); }
  function mix(a, b, t) { return a + (b - a) * t; }

  function axialToMath(q, r) { return { x: q + 0.5 * r, y: -(SQRT3 / 2) * r }; }
  function mathToScreen(p, reach) {
    unit = Math.min(width, height) / (reach * 2);
    return { x: centre.x + p.x * unit, y: centre.y - p.y * unit };
  }
  function axialToScreen(q, r, reach) { return mathToScreen(axialToMath(q, r), reach); }

  function setStroke(color, alpha, lineWidth, glow) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth * dpr;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = glow * dpr;
  }

  function setFill(color, alpha, glow) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = glow * dpr;
  }

  function drawPoint(q, r, reach, alpha, color, size) {
    if (alpha <= 0.002) return;
    const p = axialToScreen(q, r, reach);
    setFill(color, alpha, 6);
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * dpr, 0, TAU);
    ctx.fill();
  }

  function drawSegment(a, b, reach, alpha, color, lineWidth, progress = 1) {
    if (alpha <= 0.002) return;
    const p = axialToScreen(a[0], a[1], reach);
    const q = axialToScreen(b[0], b[1], reach);
    const t = clamp01(progress);
    setStroke(color, alpha, lineWidth, 5);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + (q.x - p.x) * t, p.y + (q.y - p.y) * t);
    ctx.stroke();
  }

  function drawWitnessCircle(q, r, reach, alpha, progress, color) {
    if (alpha <= 0.002) return;
    const p = axialToScreen(q, r, reach);
    setStroke(color, alpha, 1.05, 7);
    ctx.beginPath();
    ctx.arc(p.x, p.y, ledger.radius_unit * unit, -Math.PI / 2, -Math.PI / 2 + TAU * clamp01(progress));
    ctx.stroke();
  }

  function fillTriangle(a, b, c, reach, alpha) {
    if (alpha <= 0.002) return;
    const p0 = axialToScreen(a[0], a[1], reach);
    const p1 = axialToScreen(b[0], b[1], reach);
    const p2 = axialToScreen(c[0], c[1], reach);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(100,255,210,0.20)";
    ctx.shadowColor = "rgba(100,255,210,1)";
    ctx.shadowBlur = 5 * dpr;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.fill();
  }

  function stationFor(label, c) {
    const o = offsets[label];
    return [c.q + o[0], c.r + o[1]];
  }

  function generate(centres) {
    const generated = new Map();
    const centreSet = new Map();
    const duplicates = new Map();
    for (const c of centres) {
      centreSet.set(keyOf(c.q, c.r), { q: c.q, r: c.r, role: "active_centre", count: 1 });
      for (const label of OFFSET_LABELS) {
        const o = offsets[label];
        const q = c.q + o[0], r = c.r + o[1], key = keyOf(q, r);
        const previous = generated.get(key);
        if (previous) {
          previous.count += 1;
          duplicates.set(key, previous);
        } else {
          generated.set(key, { q, r, role: "generated_perimeter_station", count: 1 });
        }
      }
    }
    const catchment = new Map([...generated, ...centreSet]);
    return { generated, centreSet, duplicates, catchment };
  }

  function orderedCentres(stage, mode, phase) {
    const centres = stage.centres.slice();
    if (mode === "opposite_side_memory") {
      const priority = ["O", "A_ring", "D_ring", "B_ring", "E_ring", "C_ring", "F_ring", "A_outer", "D_outer", "B_outer", "E_outer", "C_outer", "F_outer"];
      centres.sort((a, b) => priority.indexOf(a.key) - priority.indexOf(b.key));
    } else if (mode === "carrier_weave") {
      centres.sort((a, b) => (a.q + a.r) - (b.q + b.r) || a.q - b.q || a.r - b.r);
    } else if (mode === "catchment_settlement") {
      centres.sort((a, b) => (Math.abs(a.q) + Math.abs(a.r)) - (Math.abs(b.q) + Math.abs(b.r)));
    } else {
      centres.sort((a, b) => (a.q * a.q + a.q * a.r + a.r * a.r) - (b.q * b.q + b.q * b.r + b.r * b.r));
    }
    return centres;
  }

  function stationOrder(mode) {
    if (mode === "opposite_side_memory") return ["A", "D", "B", "E", "C", "F"];
    if (mode === "carrier_weave") return ["A", "D", "B", "E", "C", "F"];
    if (mode === "catchment_settlement") return ["A", "B", "C", "D", "E", "F"];
    return ["A", "C", "E", "B", "D", "F"];
  }

  function carrierLine(p0, p1, reach, alpha, color, widthBoost = 1) {
    if (alpha <= 0.002) return;
    const a = axialToScreen(p0[0], p0[1], reach);
    const b = axialToScreen(p1[0], p1[1], reach);
    setStroke(color, alpha, 0.56 * widthBoost, 4);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function drawCarrierFamilies(reach, alpha, progress, mode) {
    const range = Math.ceil(reach * 1.55);
    const long = range + 4;
    let qIn = pulse(0.00, 0.34, progress);
    let rIn = pulse(0.22, 0.60, progress);
    let sIn = pulse(0.46, 0.84, progress);
    if (mode === "carrier_weave") {
      qIn = 0.35 + 0.65 * pulse(0.0, 0.55, progress);
      rIn = 0.24 + 0.76 * pulse(0.12, 0.70, progress);
      sIn = 0.18 + 0.82 * pulse(0.24, 0.86, progress);
    }
    if (mode === "opposite_side_memory") {
      qIn *= 1.15; rIn *= 1.05; sIn *= 1.0;
    }
    for (let k = -range; k <= range; k++) {
      const edge = 1 - Math.min(1, Math.abs(k) / (range + 1));
      const a = alpha * (0.22 + 0.78 * edge);
      carrierLine([k, -long], [k, long], reach, a * qIn, "rgba(100,255,210,1)");
      carrierLine([-long, k], [long, k], reach, a * rIn, "rgba(143,185,255,1)");
      carrierLine([-long, k + long], [long, k - long], reach, a * sIn, "rgba(234,255,247,1)");
    }
  }

  function drawSubstratePresence(stage, reach, mode, phase) {
    const range = Math.ceil(reach + 0.5);
    const base = mode === "carrier_weave" ? 0.11 : 0.07;
    for (let q = -range; q <= range; q++) {
      for (let r = -range; r <= range; r++) {
        if (q * q + q * r + r * r <= (reach + 0.2) * (reach + 0.2)) {
          const shimmer = 0.5 + 0.5 * Math.sin((q * 17 + r * 23) + phase * TAU);
          drawPoint(q, r, reach, base * (0.55 + 0.45 * shimmer), "rgba(100,255,210,1)", 0.72);
        }
      }
    }
  }

  function drawCellsForCentre(c, reach, phase, alpha, mode) {
    const labels = stationOrder(mode);
    for (let i = 0; i < labels.length; i++) {
      const currentIndex = OFFSET_LABELS.indexOf(labels[i]);
      const nextLabel = OFFSET_LABELS[(currentIndex + 1) % OFFSET_LABELS.length];
      const delay = mode === "cell_lattice_bloom" ? i * 0.035 : i * 0.018;
      const appear = alpha * pulse(0.42 + delay, 0.67 + delay, phase) * fadeOut(0.76, 0.96, phase);
      fillTriangle([c.q, c.r], stationFor(labels[i], c), stationFor(nextLabel, c), reach, appear * 0.62);
    }
  }

  function drawCentreConstruction(c, i, stage, reach, phase, mode, active) {
    const cDelay = i === 0 ? 0 : 0.04 + i * 0.012;
    const centreAlpha = active * pulse(cDelay, cDelay + 0.11, phase);
    const stationAlpha = active * pulse(0.14 + cDelay, 0.40 + cDelay, phase);
    const lineAlpha = active * pulse(0.28 + cDelay, 0.58 + cDelay, phase) * fadeOut(0.70, 0.91, phase);
    const cellAlpha = active * pulse(0.42 + cDelay, 0.68 + cDelay, phase) * fadeOut(0.75, 0.94, phase);

    drawCellsForCentre(c, reach, phase, cellAlpha * (c.key === "O" ? 1 : 0.38), mode);
    drawPoint(c.q, c.r, reach, centreAlpha * (c.key === "O" ? 0.96 : 0.66), "rgba(255,211,110,1)", c.key === "O" ? 3.2 : 2.45);

    const labels = stationOrder(mode);
    for (let j = 0; j < labels.length; j++) {
      const label = labels[j];
      const station = stationFor(label, c);
      const pairDelay = mode === "opposite_side_memory" ? Math.floor(j / 2) * 0.07 : j * 0.035;
      const appear = stationAlpha * pulse(0.12 + pairDelay, 0.32 + pairDelay, phase);
      drawPoint(station[0], station[1], reach, appear * (c.key === "O" ? 1 : 0.48), "rgba(100,255,210,1)", 2.1);
      drawSegment([c.q, c.r], station, reach, lineAlpha * 0.52, "rgba(100,255,210,1)", 0.82, pulse(0.26 + pairDelay, 0.48 + pairDelay, phase));
      const originalIndex = OFFSET_LABELS.indexOf(label);
      const next = stationFor(OFFSET_LABELS[(originalIndex + 1) % OFFSET_LABELS.length], c);
      drawSegment(station, next, reach, lineAlpha * 0.46, "rgba(234,255,247,1)", 0.86, pulse(0.38 + pairDelay, 0.59 + pairDelay, phase));
    }
  }

  function drawSingleWitnessCircle(centres, reach, phase, mode) {
    const witnessWindow = pulse(0.05, 0.20, phase) * fadeOut(0.56, 0.74, phase);
    if (witnessWindow <= 0.002) return;
    const available = Math.max(1, centres.length);
    const index = Math.min(available - 1, Math.floor(clamp01(phase) * available * 1.35));
    const c = centres[index];
    const alpha = witnessWindow * (c.key === "O" ? 0.70 : 0.42);
    const progress = mode === "catchment_settlement" ? pulse(0.05, 0.24, phase) : (0.35 + 0.65 * pulse(0.06, 0.22, phase));
    drawWitnessCircle(c.q, c.r, reach, alpha, progress, c.key === "O" ? "rgba(255,211,110,1)" : "rgba(143,185,255,1)");
  }

  function drawDuplicateSettlement(stage, reach, phase, mode) {
    const data = generate(stage.centres);
    if (data.duplicates.size === 0) return;
    const start = mode === "catchment_settlement" ? 0.50 : 0.62;
    const alpha = pulse(start, 0.88, phase) * fadeOut(0.93, 1.0, phase);
    let idx = 0;
    for (const point of data.duplicates.values()) {
      const wave = mode === "catchment_settlement" ? pulse(start + idx * 0.003, 0.88 + idx * 0.003, phase) : 1;
      const brightness = alpha * wave * Math.min(1, 0.40 + point.count * 0.16);
      drawPoint(point.q, point.r, reach, brightness, "rgba(234,255,247,1)", 2.0 + Math.min(1.8, point.count * 0.25));
      idx++;
    }
  }

  function drawCatchment(stage, reach, phase, mode) {
    const data = generate(stage.centres);
    const finalAlpha = pulse(0.74, 0.91, phase) * fadeOut(0.985, 1.0, phase);
    for (const point of data.catchment.values()) {
      const isCentre = point.role === "active_centre";
      const emphasis = mode === "cell_lattice_bloom" ? 0.86 : 1.0;
      drawPoint(point.q, point.r, reach, finalAlpha * emphasis * (isCentre ? 0.92 : 0.70), isCentre ? "rgba(255,211,110,1)" : "rgba(100,255,210,1)", isCentre ? 1.9 : 1.35);
    }
  }

  function getStage(t) {
    let acc = 0;
    for (let i = 0; i < stageSpecs.length; i++) {
      const end = acc + stageSpecs[i].duration;
      if (t < end) return { index: i, phase: (t - acc) / stageSpecs[i].duration };
      acc = end;
    }
    return { index: stageSpecs.length - 1, phase: 1 };
  }

  function reachFor(index, phase) {
    const current = stageSpecs[index];
    const next = stageSpecs[(index + 1) % stageSpecs.length];
    const k = pulse(0.90, 1.0, phase);
    return mix(current.viewReach, next.viewReach, k);
  }

  function paintBackground() {
    ctx.clearRect(0, 0, width, height);
    const g = ctx.createRadialGradient(centre.x, centre.y, 0, centre.x, centre.y, Math.min(width, height) * 0.56);
    g.addColorStop(0, "rgba(22,45,60,0.32)");
    g.addColorStop(1, "rgba(5,8,13,0)");
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height);
  }

  function render(ms) {
    resize();
    paintBackground();
    const cycle = Math.floor(ms / totalDuration);
    const t = ((ms % totalDuration) + totalDuration) % totalDuration;
    const pos = getStage(t);
    const stage = stageSpecs[pos.index];
    const phase = clamp01(pos.phase);
    const mode = MODES[(cycle + pos.index) % MODES.length];
    const reach = reachFor(pos.index, phase);
    const centres = orderedCentres(stage, mode, phase);

    drawSubstratePresence(stage, reach, mode, phase);

    const earlyCarrier = mode === "carrier_weave" ? 0.18 : mode === "opposite_side_memory" ? 0.07 : 0.035;
    drawCarrierFamilies(reach, earlyCarrier * fadeOut(0.70, 0.94, phase), pulse(0.02, 0.78, phase), mode);

    for (let i = centres.length - 1; i >= 0; i--) {
      const active = mode === "carrier_weave" ? pulse(0.02 + i * 0.006, 0.36 + i * 0.006, phase) : pulse(0.00 + i * 0.007, 0.28 + i * 0.007, phase);
      drawCentreConstruction(centres[i], i, stage, reach, phase, mode, active);
    }

    drawSingleWitnessCircle(centres, reach, phase, mode);
    drawDuplicateSettlement(stage, reach, phase, mode);

    if (stage.key === "thirteen_circle_catchment") {
      drawCatchment(stage, reach, phase, mode);
      drawCarrierFamilies(reach, 0.88 * pulse(0.78, 0.92, phase) * fadeOut(0.985, 1.0, phase), pulse(0.80, 0.92, phase), mode);
    } else {
      drawCarrierFamilies(reach, 0.55 * windowInOut(0.70, 0.98, phase), pulse(0.70, 0.96, phase), mode);
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    requestAnimationFrame(render);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
