name: Content validation

on:
  push:
    branches: [publication-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: publication-foundation

      - name: Detect committed lockfile
        id: lockfile
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 22 without cache while bootstrapping
        if: ${{ steps.lockfile.outputs.exists == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Node.js 22 with npm cache
        if: ${{ steps.lockfile.outputs.exists == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bootstrap lockfile and install dependencies
        if: ${{ steps.lockfile.outputs.exists == 'false' }}
        run: npm install

      - name: Install locked dependencies
        if: ${{ steps.lockfile.outputs.exists == 'true' }}
        run: npm ci

      - name: Commit generated lockfile
        if: ${{ github.event_name == 'pull_request' && steps.lockfile.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add deterministic npm lockfile"
          git push origin HEAD:publication-foundation

      - name: Validate canonical corpus
        run: npm run validate:content

      - name: Run focused tests
        run: npm test

      - name: Build static publication
        run: npm run build

      - name: Inspect representative static HTML
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/theory/index.html
          test -f dist/theory/01-the-object-of-study/index.html
          test -f dist/atlas/index.html
          test -f dist/atlas/01-focal-mark/index.html
          test -f dist/forms/01-focal-mark/index.html
          test -f dist/glossary/index.html
          test -f dist/glossary/completed-intelligibility/index.html
          test -f dist/history/index.html
          test -f dist/academic/index.html
          grep -q "The object of study" dist/theory/01-the-object-of-study/index.html
          grep -q "Focal distinguished standing" dist/atlas/01-focal-mark/index.html
          grep -q "A field can contain many perfectly visible things" dist/forms/01-focal-mark/index.html
          grep -q "sufficiently determinate" dist/glossary/completed-intelligibility/index.html
          grep -q "From Sentence Resolution to Constraint Grammar" dist/history/index.html
          grep -q "Academic Landscape" dist/academic/index.html
          if grep -R -qE '<script[^>]+type="module"' dist/theory dist/forms dist/glossary dist/history dist/academic; then
            echo "Unexpected module hydration script found on reading routes" >&2
            exit 1
          fi
          echo "Representative reading routes contain source-derived static HTML and no module hydration scripts."

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: static-publication
          path: dist
