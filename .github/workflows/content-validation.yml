name: Content validation

on:
  push:
    branches: [publication-foundation, publication-finishing-pass, homepage-study-sequence, agent/developmental-reading-path]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Validate canonical corpus
        run: npm run validate:content
      - name: Run focused tests
        run: npm test
      - name: Build static publication
        run: npm run build
      - name: Inspect representative static HTML
        shell: bash
        run: |
          set -euxo pipefail
          test -f dist/index.html
          test -f dist/theory/index.html
          test -f dist/atlas/index.html
          test -f dist/forms/01-focal-mark/index.html
          test -f dist/glossary/completed-intelligibility/index.html
          test -f dist/history/index.html
          test -f dist/academic/index.html
          test -f dist/layman/index.html
          test -f dist/five-year-old/index.html
          test -f dist/venture/index.html
          test -f dist/mainstream/index.html
          test -f dist/research-status/index.html
          test -f dist/about/index.html
          test -f dist/search/index.html
          test -f dist/search-index.json
          test -f dist/constraint-grammar-portable-knowledge-edition.txt

          for year in $(seq 6 18); do
            test -f "dist/five-year-old/${year}/index.html"
            grep -q 'meta name="robots" content="noindex,follow"' "dist/five-year-old/${year}/index.html"
          done

          grep -q "Two simple ways in" dist/index.html
          grep -q 'href="/persistence/layman/' dist/index.html
          grep -q 'href="/persistence/five-year-old/' dist/index.html
          grep -q "Take the entire publication to a GPT" dist/index.html
          grep -q 'href="/persistence/constraint-grammar-portable-knowledge-edition.txt' dist/index.html
          grep -q "Enter the formal publication" dist/index.html
          grep -q "Three longer essays" dist/index.html
          grep -q 'href="/persistence/venture/' dist/index.html
          grep -q 'href="/persistence/mainstream/' dist/index.html

          grep -q "The Five-Year-Old Edition" dist/five-year-old/index.html
          grep -q "How Does Something Become" dist/five-year-old/index.html
          grep -q 'href="/persistence/five-year-old/6/' dist/five-year-old/index.html
          grep -q "Continue the explanation" dist/five-year-old/index.html
          grep -q "How Does Something Become Finished Enough to Let Us Go On?" dist/five-year-old/6/index.html
          grep -q 'href="/persistence/five-year-old/7/' dist/five-year-old/6/index.html
          grep -q "What the Theory Has Shown—and What It Still Has to Earn" dist/five-year-old/18/index.html
          grep -q "And, of course, we knew all along that you were never five." dist/five-year-old/18/index.html

          if grep -q 'five-year-old/6/' dist/index.html; then
            echo "Developmental sequence leaked into homepage navigation" >&2
            exit 1
          fi
          if grep -q 'five-year-old/6/' dist/search-index.json; then
            echo "Developmental sequence leaked into the ordinary search index" >&2
            exit 1
          fi
          if grep -q "And, of course, we knew all along that you were never five." dist/constraint-grammar-portable-knowledge-edition.txt; then
            echo "Developmental sequence leaked into the Portable Knowledge Edition" >&2
            exit 1
          fi

          grep -q "Portable Knowledge Edition: personal study permission" dist/rights/index.html
          grep -q "Permission for broader use" dist/rights/index.html

          grep -q "PORTABLE KNOWLEDGE EDITION" dist/constraint-grammar-portable-knowledge-edition.txt
          grep -q "Copyright © 9 August 2026 Liam Moloney. All Rights Reserved." dist/constraint-grammar-portable-knowledge-edition.txt
          grep -q "A SUGGESTED WAY TO USE THIS FILE WITH A GPT OR OTHER AI TOOL" dist/constraint-grammar-portable-knowledge-edition.txt
          grep -q "FIVE-YEAR-OLD EDITION" dist/constraint-grammar-portable-knowledge-edition.txt
          grep -q "SOURCE STATUS: CANONICAL THEORY" dist/constraint-grammar-portable-knowledge-edition.txt
          grep -q "SOURCE STATUS: CANONICAL STRUCTURAL ATLAS" dist/constraint-grammar-portable-knowledge-edition.txt
          grep -q "SOURCE STATUS: AUTHORITATIVE GLOSSARY" dist/constraint-grammar-portable-knowledge-edition.txt
          grep -q "SOURCE STATUS: DERIVED STRATEGIC INTERPRETATION" dist/constraint-grammar-portable-knowledge-edition.txt
          grep -q "What has not been proven" dist/constraint-grammar-portable-knowledge-edition.txt
          test "$(wc -c < dist/constraint-grammar-portable-knowledge-edition.txt)" -gt 100000

          test "$(grep -o 'data-transformation=' dist/atlas/index.html | wc -l)" -eq 54
          grep -q "The object of study" dist/theory/01-the-object-of-study/index.html
          grep -q "Focal distinguished standing" dist/atlas/01-focal-mark/index.html
          grep -q "sufficiently determinate" dist/glossary/completed-intelligibility/index.html
          grep -q 'https://titanicparker.github.io/persistence/' dist/index.html
          if grep -R -qE 'href="/(theory|atlas|forms|glossary|history|academic|layman|five-year-old|venture|mainstream|research-status|about|search)(/|\")' dist; then
            echo "Found a publication link that escaped the /persistence/ base path" >&2
            exit 1
          fi
          if grep -R -qE '<script[^>]+type="module"' dist/theory dist/forms dist/glossary dist/history dist/academic; then
            echo "Unexpected module hydration script found on core reading routes" >&2
            exit 1
          fi
          echo "Homepage, gateway-only developmental sequence, portable knowledge edition, canonical routes, and /persistence/ base paths verified."
      - name: Upload static build
        uses: actions/upload-artifact@v7
        with:
          name: static-publication
          path: dist
